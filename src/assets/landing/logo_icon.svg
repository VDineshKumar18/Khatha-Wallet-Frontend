<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="walletGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="claspGradIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="dropShadowIcon" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Book Spine Pages Layer -->
    <path d="M 40,40 L 260,40 A 20,20 0 0 1 280,60 L 280,75 A 5,5 0 0 1 275,80 L 40,80 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="8" stroke-linejoin="round" />
    <path d="M 50,55 L 250,55 A 10,10 0 0 1 260,65 L 260,75 L 50,75 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="4" />

    <!-- Main Book Cover/Wallet Body -->
    <rect x="40" y="70" width="240" height="240" rx="24" fill="url(#walletGradIcon)" filter="url(#dropShadowIcon)" />

    <!-- Spine details on the left of the wallet -->
    <path d="M 40,70 L 70,70 L 70,310 L 40,310 Z" fill="#1e40af" opacity="0.4" />

    <!-- Wallet Clasp -->
    <path d="M 280,150 L 230,150 C 200,150 190,165 190,190 C 190,215 200,230 230,230 L 280,230 Z" fill="url(#claspGradIcon)" filter="url(#dropShadowIcon)" />
    <path d="M 280,150 L 230,150 C 200,150 190,165 190,190 C 190,215 200,230 230,230 L 280,230" fill="none" stroke="#ffffff" stroke-width="6" />

    <!-- Rupee Circle Button -->
    <circle cx="215" cy="190" r="28" fill="#ffffff" />

    <!-- Rupee Symbol (₹) inside Circle -->
    <text x="215" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#1d4ed8" text-anchor="middle">₹</text>
  </g>
</svg>
